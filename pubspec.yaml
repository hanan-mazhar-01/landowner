name: landowner
description: "LandOwner — a private property operating system."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.2
  intl: ^0.20.3
  path_drawing: ^1.0.1
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  local_auth: ^3.0.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  http: ^1.3.0
  crypto: ^3.0.3
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  file_picker: ^13.1.0
  timezone: ^0.11.1
  geolocator: ^14.1.1
  geocoding: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nav/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
